<!DOCTYPE HTML>
<html>
<head>
    <title>Spectrogramme</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="assets/css/main.css" />
</head>

<body>
    <div id="page-wrapper">

        <section id="main" class="container">
            <header>
                <h2>Générateur de spectrogramme</h2>
                <p>Choisissez un fichier audio WAV pour générer son spectrogramme.</p>
            </header>

            <div class="box">
                <a href="projet_rust.zip" download class="button">
                    Télécharger le projet
                </a>
                <br><br>
                <div id="drop-zone">
                    <input type="file" id="file-input" accept=".wav,audio/wav" />
                </div>

                <p id="file-name"></p>

                <button id="generate-btn">
                    Générer le spectrogramme
                </button>

                <hr>

                <h3>Résultat :</h3>
                <p id="status"></p>
                <img id="spectrogram-img" style="display:none; max-width:100%;" />
            </div>
        </section>

    </div>

    <script src="assets/js/spectrogramme.js"></script>
</body>
</html>
